<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LD Add-ons – مودات ماين كرافت</title>
<meta name="color-scheme" content="dark">
<style>
:root{--bg:#06070a;--card:#0d1016;--line:#1b202b;--tx:#f2f4f8;--mu:#8a93a6;--r:#ff2a3d;--g:#19ff6b;--b:#3da5ff;--y:#ffc107;--p:#b66dff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);min-height:100vh;background-image:radial-gradient(600px 300px at 90% -5%,#ff2a3d26,transparent),radial-gradient(600px 300px at 5% 0,#19ff6b1f,transparent);background-repeat:no-repeat}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#07080cd9;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1}
.logo b{font-size:17px;letter-spacing:1px}.logo small{display:block;color:var(--mu);font-size:10px;letter-spacing:2px}
.ibtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:20px;transition:.2s}
.ibtn:hover{border-color:var(--g);box-shadow:0 0 14px #19ff6b55}
.menu{position:absolute;top:58px;left:14px;min-width:190px;background:#0d1016;border:1px solid var(--line);border-radius:14px;padding:6px;display:none;box-shadow:0 10px 40px #000c,0 0 20px #ff2a3d33}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:right;background:none;border:0;padding:12px;border-radius:10px;cursor:pointer;font-size:14px}
.menu button:hover{background:#ffffff0d}
main{max-width:1000px;margin:0 auto;padding:16px 14px 40px}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;transition:.2s}
.search:focus-within{border-color:var(--r);box-shadow:0 0 18px #ff2a3d44}
.search input{flex:1;background:none;border:0;outline:0;padding:15px 0}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:.2s;font-size:13px}
.tile i{display:block;font-style:normal;font-size:22px;margin-bottom:4px}.tile em{display:block;font-style:normal;color:var(--g);font-size:11px;margin-top:3px}
.tile:hover,.tile.on{border-color:var(--g);box-shadow:0 0 16px #19ff6b55;transform:translateY(-2px)}
h2{font-size:20px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:5px;height:22px;border-radius:3px;background:linear-gradient(var(--r),var(--g));box-shadow:0 0 10px var(--g)}
.feat{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.fc{flex:0 0 82%;max-width:420px;scroll-snap-align:start;border-radius:18px;padding:18px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid #ffffff22;position:relative;overflow:hidden;cursor:pointer}
.fc .em{position:absolute;top:10px;left:14px;font-size:64px;opacity:.9}
.fc h3{font-size:22px}.fc p{color:#ffffffbb;font-size:13px;margin:3px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.chip{white-space:nowrap;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px}
.chip.on{background:linear-gradient(135deg,var(--r),#b3001b);border-color:var(--r);box-shadow:0 0 14px #ff2a3d77}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:.25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);border-color:var(--r);box-shadow:0 0 22px #ff2a3d55,0 0 40px #19ff6b22}
.cov{height:130px;display:grid;place-items:center;font-size:54px;position:relative;font-weight:900}
.tag{position:absolute;top:8px;left:8px;background:var(--r);font-size:10px;padding:4px 9px;border-radius:8px;font-weight:700;color:#fff}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:#000a;border:1px solid #ffffff33;cursor:pointer;font-size:16px;display:grid;place-items:center}
.heart.on{color:var(--r);border-color:var(--r);box-shadow:0 0 14px var(--r)}
.cb{padding:12px;flex:1}.cb h4{font-size:15px}.cb p{color:var(--mu);font-size:12px;margin-top:3px}
.cf{display:flex;gap:8px;align-items:center;padding:0 12px 12px}
.sq{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#0a0c11;display:grid;place-items:center;cursor:pointer}
.sq:hover{border-color:var(--g);box-shadow:0 0 12px #19ff6b66}
.pill{font-size:10px;font-weight:700;padding:5px 10px;border-radius:8px;border:1px solid #ff2a3d66;color:var(--r);background:#ff2a3d1a}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.hero{height:230px;border-radius:20px;display:grid;place-items:center;font-size:90px;position:relative;border:1px solid #ffffff22;overflow:hidden;box-shadow:0 0 30px #ff2a3d33}
.hero .ttl{position:absolute;bottom:12px;right:16px;font-size:26px;font-weight:900;text-shadow:0 2px 10px #000}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.in{border-radius:14px;padding:12px;border:1px solid;background:#0a0c11}
.in small{display:block;color:var(--mu);font-size:11px;margin-bottom:5px}.in b{font-size:14px;word-break:break-word}
.c-g{border-color:#19ff6b55}.c-g b{color:var(--g)}.c-r{border-color:#ff2a3d55}.c-r b{color:var(--r)}.c-b{border-color:#3da5ff55}.c-b b{color:var(--b)}.c-y{border-color:#ffc10755}.c-y b{color:var(--y)}.c-p{border-color:#b66dff55}.c-p b{color:var(--p)}
.ver{color:var(--g);font-size:12px;margin-top:12px;display:flex;gap:6px;align-items:center}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.shots div{height:110px;border-radius:14px;display:grid;place-items:center;font-size:38px;border:1px solid var(--line)}
.dl{flex:1;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px;cursor:pointer;background:linear-gradient(135deg,var(--g),#00a844);color:#031a0b;box-shadow:0 0 22px #19ff6b88;transition:.2s;text-align:center;text-decoration:none}
.dl:hover{transform:scale(1.02);box-shadow:0 0 34px #19ff6bcc}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--r),#b3001b);box-shadow:0 0 16px #ff2a3d66}
.btn.g{background:linear-gradient(135deg,var(--g),#00a844);color:#031a0b;box-shadow:0 0 16px #19ff6b66}
.btn.d{background:#1b202b;box-shadow:none}
.fld{display:block;margin-top:12px;font-size:13px;color:var(--mu)}
.fld input,.fld textarea,.fld select{display:block;width:100%;margin-top:6px;background:#0a0c11;border:1px solid var(--line);border-radius:12px;padding:12px;outline:0;direction:ltr;text-align:left}
.fld textarea{direction:rtl;text-align:right;min-height:80px}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--g);box-shadow:0 0 14px #19ff6b44}
.login{max-width:400px;margin:40px auto;text-align:center;box-shadow:0 0 40px #ff2a3d33,0 0 60px #19ff6b22;border-color:#ffffff22}
.err{color:var(--r);font-size:13px;margin-top:10px;min-height:18px}
.arow{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:#0a0c11}
.arow span{flex:1;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:40px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0d1016;border:1px solid var(--g);padding:12px 20px;border-radius:12px;box-shadow:0 0 20px #19ff6b66;z-index:50;font-size:14px}
@media(max-width:520px){.tiles{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr;gap:10px}.cov{height:100px;font-size:42px}.cb h4{font-size:13px}}

.lg{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 0 8px #19ff6b88)}
.banner{display:flex;gap:14px;align-items:center;padding:18px;border-radius:20px;background:linear-gradient(120deg,#ff2a3d40,#0d1016 50%,#19ff6b40);border:1px solid #ffffff2a;margin-bottom:14px;box-shadow:0 0 30px #ff2a3d33,0 0 30px #19ff6b22}
.banner .lg{width:84px;height:84px;flex:none}
.banner h1{font-size:26px;letter-spacing:2px;background:linear-gradient(90deg,var(--r),var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
.banner p{color:#b8c0d0;font-size:13px;margin:4px 0 12px}
.cov{height:150px;overflow:hidden}
.cov:after{content:"Add-On";position:absolute;bottom:6px;right:8px;font-size:10px;font-weight:800;background:#000b;border:1px solid #ffffff44;padding:2px 8px;border-radius:6px;z-index:2}
.ci{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s}
.card:hover .ci{transform:scale(1.08)}
.art{position:relative;z-index:1;padding:0 10px;text-align:center;font-weight:900;text-transform:uppercase;font-size:24px;line-height:1.05;color:#ffe14d;-webkit-text-stroke:1.5px #000;paint-order:stroke fill;text-shadow:0 3px 0 #c76a00,0 0 18px #000a;transform:rotate(-3deg);font-family:Impact,"Arial Black",system-ui,sans-serif}
.art.big{font-size:44px}
.em2{position:absolute;font-size:84px;opacity:.28;bottom:-8px;left:8px}
.hero .ci{border-radius:0}
.fc .ov{position:absolute;inset:0;background:linear-gradient(transparent 20%,#000d)}
.fc h3,.fc p,.fc .row{position:relative;z-index:1}
.shots div{position:relative;overflow:hidden}
.gbtn{flex:1;text-align:center;padding:11px;border-radius:12px;font-weight:800;font-size:14px;background:linear-gradient(135deg,var(--g),#00a844);color:#031a0b;text-decoration:none;box-shadow:0 0 16px #19ff6b66;transition:.2s}
.gbtn:hover{transform:scale(1.04);box-shadow:0 0 26px #19ff6bcc}
@keyframes pl{0%,100%{box-shadow:0 0 18px #19ff6b88}50%{box-shadow:0 0 36px #19ff6bdd}}
.dl{animation:pl 2s infinite}
.card{background:linear-gradient(#0f131b,#0b0e14)}
.card:hover .gbtn{box-shadow:0 0 24px #19ff6bbb}
@media(max-width:520px){.banner h1{font-size:20px}.banner .lg{width:64px;height:64px}.cov{height:115px}.art{font-size:17px}.art.big{font-size:32px}.gbtn{font-size:12px;padding:9px}.cf .pill{display:none}}
.gbtn,.dl{cursor:pointer}
.foot{max-width:1000px;margin:0 auto;padding:10px 14px calc(30px + env(safe-area-inset-bottom,0px));text-align:center}
.foot p{color:var(--mu);font-size:12px;margin-top:16px}
.tg{display:flex;align-items:center;justify-content:center;gap:14px;padding:20px;border-radius:999px;font-size:22px;font-weight:900;color:#fff;text-decoration:none;background:radial-gradient(circle at 30% 25%,#7fd6ff,#1e9bf0 45%,#0a5fb4);box-shadow:0 10px 30px #1e9bf099,0 0 40px #1e9bf055,inset 0 -6px 14px #0003,inset 0 6px 14px #fff4;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.tg svg{width:40px;height:40px;fill:#fff}
.tk{display:inline-flex;margin-top:14px;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;background:#000;border:1px solid #fff3;color:#fff;font-weight:800;text-decoration:none;box-shadow:-3px 0 14px #25f4ee66,3px 0 14px #fe2c5566}
.tk svg{width:26px;height:26px;fill:#fff;filter:drop-shadow(-2px 0 #25f4ee) drop-shadow(2px 0 #fe2c55)}
</style>
</head>

var CATS={all:["الكل","✨"],mods:["مودات","🧩"],skins:["سكنات","👕"],maps:["خرائط","🧭"],resource:["ريسورس باك","🖼️"],servers:["سيرفرات","👑"]};
var mods,likes={},admin=false,cat="all",q="";
mods=[];
try{likes=JSON.parse(localStorage.getItem("ld_likes"))||{}}catch(e){}

function save(){try{localStorage.setItem("ld_likes",JSON.stringify(likes))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function go(h){location.hash=h;route()}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function bg(m){return "background:linear-gradient(135deg,"+esc(m.c1)+","+esc(m.c2)+")"}
function menu(){
  $("menu").innerHTML='<button onclick="go(\'\')">🏠 الصفحة الرئيسية</button><button onclick="go(\'admin\')">🛠️ لوحة الأدمن</button>'+(admin?'<button onclick="logout()">🚪 تسجيل الخروج</button>':'<button onclick="go(\'login\')">🔑 تسجيل الدخول</button>');
}
$("mbtn").onclick=function(e){e.stopPropagation();menu();$("menu").classList.toggle("on")};
document.addEventListener("click",function(){$("menu").classList.remove("on")});
function logout(){admin=false;save();go("")}
function like(id,e){e.stopPropagation();likes[id]=!likes[id];save();route(true)}
function cov(m,big){return m.img?'<img class="ci" src="'+esc(m.img)+'" alt="">':'<span class="em2">'+esc(m.em)+'</span><span class="art'+(big?' big':'')+'">'+esc(m.title)+'</span>'}
function goGrid(){var g=document.querySelector(".grid");if(g)g.scrollIntoView({behavior:"smooth"})}
function card(m){
  return '<div class="card" onclick="go(\'mod-'+m.id+'\')"><div class="cov" style="'+bg(m)+'">'+cov(m)+'<span class="tag">'+esc((CATS[m.cat]||["MODS"])[0])+'</span><button class="heart '+(likes[m.id]?"on":"")+'" onclick="like('+m.id+',event)">'+(likes[m.id]?"♥":"♡")+'</button></div><div class="cb"><h4>'+esc(m.title)+'</h4><p>'+esc(m.sub)+'</p></div><div class="cf"><a class="gbtn" onclick="event.stopPropagation();dlAll('+m.id+')">⬇ تحميل</a><span class="pill">'+esc(m.edition)+'</span></div></div>';
}
function home(keep){
  var list=mods.filter(function(m){return(cat=="all"||m.cat==cat)&&(m.title+" "+m.sub).toLowerCase().indexOf(q.toLowerCase())>-1});
  var h='<div class="banner"><img class="lg" src="'+LOGO+'" alt=""><div><h1>LD ADD-ONS</h1><p>أقوى مودات وخرائط وسكنات ماين كرافت، تحميل مجاني وآمن</p><div class="row"><span class="btn g" onclick="goGrid()">⬇ تصفح المودات</span><span class="pill" style="color:var(--g);border-color:#19ff6b66;background:#19ff6b1a">'+mods.length+' محتوى</span></div></div></div><div class="search"><span>🔍</span><input id="q" placeholder="ابحث عن مود أو خريطة أو سكن..." value="'+esc(q)+'"></div><div class="tiles">';
  Object.keys(CATS).filter(function(k){return k!="all"}).forEach(function(k){var n=mods.filter(function(m){return m.cat==k}).length;h+='<div class="tile '+(cat==k?"on":"")+'" onclick="setCat(\''+k+'\')"><i>'+CATS[k][1]+'</i>'+CATS[k][0]+'<em>+'+n+'</em></div>'});
  h+='</div><h2>⭐ المميز</h2><div class="feat">';
  mods.slice(0,3).forEach(function(m){h+='<div class="fc" style="'+bg(m)+'" onclick="go(\'mod-'+m.id+'\')">'+(m.img?'<img class="ci" src="'+esc(m.img)+'" alt=""><div class="ov"></div>':'<span class="em">'+esc(m.em)+'</span>')+'<h3>'+esc(m.title)+'</h3><p>'+esc(m.sub)+'</p><div class="row"><span class="btn g" style="padding:8px 14px;font-size:13px">⬇ تحميل</span><span class="btn" style="padding:8px 14px;font-size:13px">التفاصيل</span></div></div>'});
  h+='</div><h2>🔥 الأكثر طلباً</h2><div class="chips">';
  Object.keys(CATS).forEach(function(k){h+='<div class="chip '+(cat==k?"on":"")+'" onclick="setCat(\''+k+'\')">'+CATS[k][0]+'</div>'});
  h+='</div>'+(list.length?'<div class="grid">'+list.map(card).join("")+'</div>':'<div class="empty">لا توجد نتائج</div>');
  $("app").innerHTML=h;
  var i=$("q");i.oninput=function(){q=i.value;var p=i.selectionStart;home();var n=$("q");n.focus();n.setSelectionRange(p,p)};
}
function setCat(k){cat=cat==k?"all":k;route()}
function mod(id){
  var m=mods.filter(function(x){return x.id==id})[0];
  if(!m){$("app").innerHTML='<div class="empty">المود غير موجود</div>';return}
  var h='<div class="hero" style="'+bg(m)+'">'+cov(m,1)+'</div>';
  h+='<div class="box"><div class="row"><span class="pill">MODS • ADDONS</span><span class="pill" style="color:var(--y);border-color:#ffc10766;background:#ffc1071a">✨ مميز</span></div><h2 style="margin-top:12px">'+esc(m.title)+'</h2><div class="row"><span class="pill" style="color:var(--g);border-color:#19ff6b66;background:#19ff6b1a">'+esc((CATS[m.cat]||["مود"])[0])+'</span><span id="pv" class="pill" style="color:var(--b);border-color:#3da5ff66;background:#3da5ff1a">👁 '+m.views+'</span><span id="pd" class="pill" style="color:var(--g);border-color:#19ff6b66;background:#19ff6b1a">⬇ '+(m.dls||0)+'</span><button class="heart '+(likes[m.id]?"on":"")+'" style="position:static" onclick="like('+m.id+',event)">'+(likes[m.id]?"♥":"♡")+'</button></div></div>';
  h+='<div class="box"><h2 style="margin-top:0;font-size:16px">🌐 تفاصيل ووصف المود</h2><p style="line-height:1.9;color:#cfd5e2">'+esc(m.desc)+'</p></div>';
  h+='<div class="box"><div class="info"><div class="in c-g"><small>التوافق</small><b>'+esc(m.compat)+'</b></div><div class="in c-r"><small>اسم المود</small><b>'+esc(m.title)+'</b></div><div class="in c-b"><small>مود ID</small><b>#'+m.id+'</b></div><div class="in c-y"><small>إصدار اللعبة</small><b>'+esc(m.ver)+'</b></div><div class="in c-p"><small>Edition</small><b>'+esc(m.edition)+'</b></div><div class="in c-g"><small>الفئة والتصنيف</small><b>'+esc((CATS[m.cat]||["مود"])[0])+'</b></div></div><div class="ver">🛡️ تم الفحص والتوثيق بواسطة LD Team — آمن وخالٍ من أي مشاكل</div></div>';
  var cs=[[m.c1,m.c2],[m.c2,m.c1],["#1b5e20","#19ff6b"],["#b3001b","#ff2a3d"]];
  h+='<div class="box"><h2 style="margin-top:0;font-size:16px">🖼️ لقطات اللعب (4)</h2><div class="shots">'+(m.shots&&m.shots.length?m.shots.map(function(x){return '<div><img class="ci" src="'+esc(x)+'" alt=""></div>'}).join(""):cs.map(function(c,i){return '<div style="background:linear-gradient(135deg,'+esc(c[0])+','+esc(c[1])+')">'+["❄️","🌸","⛏️","🌅"][i]+'</div>'}).join(""))+'</div></div>';
  h+='<div class="box" style="border-color:#ff2a3d55;box-shadow:0 0 24px #ff2a3d33"><p style="text-align:center;margin-bottom:12px">جاهز لتجربة المود في ماين كرافت؟</p><div class="row"><button class="sq" style="width:52px;height:52px" onclick="share()">🔗</button><a class="dl" onclick="dlAll('+m.id+')">⬇ تحميل المود'+(m.files&&m.files.length>1?' ('+m.files.length+' ملفات)':'')+'</a></div></div>';
  $("app").innerHTML=h;
}

function loginPage(){
  $("app").innerHTML='<div class="box login"><img class="lg" style="width:84px;height:84px" src="'+LOGO+'" alt=""><h2 style="justify-content:center">تسجيل الدخول</h2><label class="fld">الإيميل<input id="em" type="text" autocomplete="off" placeholder="Email"></label><label class="fld">كلمة السر<input id="pw" type="password" autocomplete="off" placeholder="Password"></label><div class="err" id="err"></div><button class="btn g" style="width:100%;margin-top:6px" onclick="doLogin()">دخول</button></div>';
}

function rd(file,w){return new Promise(function(ok){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,w/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.72))};im.onerror=function(){ok(null)};im.src=r.result};r.readAsDataURL(file)})}

var CNS="ld"+location.hostname.replace(/[^a-z0-9]/gi,"").toLowerCase().slice(0,40),CNT="https://abacus.jasoncameron.dev";
