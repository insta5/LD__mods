function rd(file,w){return new Promise(function(ok){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,w/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.72))};im.onerror=function(){ok(null)};im.src=r.result};r.readAsDataURL(file)})}

async function ghDel(p){try{var s=await ghSha(p);if(s)await fetch(ghU(p),{method:"DELETE",headers:ghH(),body:JSON.stringify({message:"delete",sha:s,branch:cfg.b})})}catch(e){}}

/* ===== الخلفية المتحركة (مكعبات + جزيئات) ===== */
(function(){
  var c=$("bgc"),x=c.getContext("2d"),W,H,cubes=[],ps=[],names=["grass","diamond","tnt","emerald","chest","creeper"],imgs=[],last=0;
  var still=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
  names.forEach(function(n){var i=new Image();i.src=src(n);imgs.push(i)});
  function size(){var d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
  function cube(init){return{x:Math.random()*W,y:init?Math.random()*H:H+60,s:26+Math.random()*26,v:12+Math.random()*16,r:Math.random()*6,rv:(Math.random()-.5)*.6,i:Math.floor(Math.random()*imgs.length)}}
  function part(init){return{x:Math.random()*W,y:init?Math.random()*H:-10,s:3+Math.random()*3,v:30+Math.random()*50,c:Math.random()<.5?"#ff2a3d":"#19ff6b"}}
  function init(){size();cubes=[];ps=[];for(var i=0;i<7;i++)cubes.push(cube(1));for(i=0;i<28;i++)ps.push(part(1))}
  function draw(t){
    var dt=Math.min((t-last)/1000,.05);last=t;x.clearRect(0,0,W,H);
    ps.forEach(function(p,k){p.y+=p.v*dt;if(p.y>H+10)ps[k]=part();x.globalAlpha=.35;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});
    cubes.forEach(function(q,k){q.y-=q.v*dt;q.r+=q.rv*dt;if(q.y<-80)cubes[k]=cube();x.save();x.globalAlpha=.16;x.translate(q.x,q.y);x.rotate(q.r);x.imageSmoothingEnabled=false;if(imgs[q.i].complete)x.drawImage(imgs[q.i],-q.s/2,-q.s/2,q.s,q.s);x.restore()});
    if(!still)requestAnimationFrame(draw)
  }
  addEventListener("resize",size);init();requestAnimationFrame(draw);
})();
